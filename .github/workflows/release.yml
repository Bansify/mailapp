name: Build Signed Release APK & Publish GitHub Release

on:
  push:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.1 - leave empty for auto 1.0.X)'
        required: false
        default: ''
      version_code:
        description: 'Version Code (Integer, e.g. 12 - leave blank for auto increment)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, Sign & Publish Bansify Email APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure Android SDK 36 components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          chmod +x ./gradlew
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            if [ ! -d "$SDK_ROOT/platforms/android-36" ] || [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
              "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            fi
          fi

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # Publishing rules, so every push ends up on the Releases page without polluting the
      # version history: tags and main/master pushes get a new versioned release (v1.0.<build>),
      # every other branch refreshes a single rolling pre-release tagged `latest`.
      - name: Determine version, tag and publication mode
        id: versioning
        run: |
          set -euo pipefail
          V_CODE="${{ inputs.version_code }}"
          [ -n "$V_CODE" ] || V_CODE="${{ github.run_number }}"

          INPUT_NAME="${{ inputs.version_name }}"
          if [ -n "$INPUT_NAME" ]; then
            V_NAME="$INPUT_NAME"
            MODE="versioned"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            V_NAME="${GITHUB_REF_NAME#v}"
            MODE="versioned"
          elif [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; then
            V_NAME="1.0.${V_CODE}"
            MODE="versioned"
          else
            # Feature/preview branch: keep the version unique but publish as a pre-release.
            BRANCH_SLUG=$(printf '%s' "${GITHUB_REF_NAME}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
            V_NAME="1.0.${V_CODE}-${BRANCH_SLUG}"
            MODE="rolling"
          fi

          if [ "$MODE" = "versioned" ]; then
            TAG="v${V_NAME}"
          else
            TAG="latest"
          fi

          echo "Mode: $MODE"
          echo "Version Code: $V_CODE"
          echo "Version Name: $V_NAME"
          echo "Release tag: $TAG"
          echo "v_code=$V_CODE" >> "$GITHUB_OUTPUT"
          echo "v_name=$V_NAME" >> "$GITHUB_OUTPUT"
          echo "v_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "v_mode=$MODE" >> "$GITHUB_OUTPUT"

      # Secrets cannot be referenced from an `if:` expression, so their presence is resolved once
      # here. A missing keystore never fails the build: the run then publishes an unsigned release
      # APK next to the debug APK instead of silently stopping.
      - name: Resolve signing secrets
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASS}" ]; then
            echo "can_sign=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets found; the release APK and AAB will be signed."
          else
            echo "can_sign=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Release build is unsigned::Configure RELEASE_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD to publish a signed APK. This run publishes the debug-signed APK and an UNSIGNED release APK."
            {
              echo "### Release build is unsigned"
              echo ""
              echo "Repository secrets \`RELEASE_KEYSTORE_BASE64\`, \`KEYSTORE_PASSWORD\`, \`KEY_ALIAS\` and"
              echo "\`KEY_PASSWORD\` are not configured, so this release contains the debug APK and an"
              echo "unsigned release APK. Release artifacts are never signed with the debug key."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            -PversionCode=${{ steps.versioning.outputs.v_code }} \
            -PversionName=${{ steps.versioning.outputs.v_name }} \
            --no-daemon --max-workers=2

      - name: Build Release APK, Debug APK & Play Store AAB
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey \
              -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" || true
          fi
          ./gradlew :app:assembleRelease :app:assembleDebug :app:bundleRelease \
            -PversionCode=${{ steps.versioning.outputs.v_code }} \
            -PversionName=${{ steps.versioning.outputs.v_name }} \
            --no-daemon --max-workers=2

      - name: Stage debug APK
        run: |
          set -euo pipefail
          mkdir -p release_out
          V_NAME="${{ steps.versioning.outputs.v_name }}"
          DEBUG_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1 || true)
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "release_out/BansifyEmail-v${V_NAME}-Debug.apk"
          fi

      - name: Sign Release APK & AAB using Repository Keystore Secrets
        if: steps.signing.outputs.can_sign == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          set -euo pipefail
          mkdir -p release_out

          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          UNSIGNED_AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          KS_PATH="/tmp/gothwad_mail_release.jks"
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KS_PATH"

          DETECTED_ALIAS=$(keytool -list -v -keystore "$KS_PATH" -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: //I' | tr -d '\r' | xargs || true)
          if [ -n "$KEY_ALIAS" ]; then
            ACTUAL_ALIAS="$KEY_ALIAS"
          elif [ -n "$DETECTED_ALIAS" ]; then
            ACTUAL_ALIAS="$DETECTED_ALIAS"
          else
            echo "::error::KEY_ALIAS secret is empty and could not be auto-detected from keystore."
            rm -f "$KS_PATH"
            exit 1
          fi

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools/" -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools/" -name "apksigner" | sort -V | tail -n 1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found in ANDROID_HOME"; rm -f "$KS_PATH"; exit 1; }

          if [ -n "$UNSIGNED_APK" ]; then
            UNALIGNED_TEMP="/tmp/unaligned_release.apk"
            if [ -n "$ZIPALIGN" ]; then
              "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" "$UNALIGNED_TEMP" || cp "$UNSIGNED_APK" "$UNALIGNED_TEMP"
            else
              cp "$UNSIGNED_APK" "$UNALIGNED_TEMP"
            fi

            RELEASE_APK="release_out/BansifyEmail-v${V_NAME}-Release.apk"
            "$APKSIGNER" sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$ACTUAL_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:${KEY_PASS:-$KEYSTORE_PASS}" \
              --out "$RELEASE_APK" \
              "$UNALIGNED_TEMP"

            "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
            rm -f "$UNALIGNED_TEMP"

            CERT_COLON=$(keytool -list -v -keystore "$KS_PATH" -alias "$ACTUAL_ALIAS" -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -i "SHA256:" | head -n 1 | sed 's/.*SHA256: //I' | tr -d '\r' | xargs || true)
            CERT_HEX=$(echo "$CERT_COLON" | tr -d ':' | tr '[:upper:]' '[:lower:]')
            {
              echo "### Bansify Email v${V_NAME} Release Signing Identity"
              echo "- Package: \`com.bansify.mail\`"
              echo "- App Link SHA-256 (\`assetlinks.json\`): \`${CERT_COLON}\`"
              echo "- D1 \`ecosystem_apps\` SHA-256 (lowercase hex): \`${CERT_HEX}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$UNSIGNED_AAB" ]; then
            RELEASE_AAB="release_out/BansifyEmail-v${V_NAME}-PlayStore.aab"
            cp "$UNSIGNED_AAB" "$RELEASE_AAB"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS_PATH" \
              -storepass "$KEYSTORE_PASS" \
              -keypass "${KEY_PASS:-$KEYSTORE_PASS}" \
              "$RELEASE_AAB" \
              "$ACTUAL_ALIAS"
          fi

          rm -f "$KS_PATH"

      - name: Stage unsigned release APK & AAB
        if: steps.signing.outputs.can_sign != 'true'
        run: |
          set -euo pipefail
          mkdir -p release_out
          V_NAME="${{ steps.versioning.outputs.v_name }}"
          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1 || true)
          UNSIGNED_AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1 || true)
          if [ -n "$UNSIGNED_APK" ]; then
            cp "$UNSIGNED_APK" "release_out/BansifyEmail-v${V_NAME}-Release-UNSIGNED.apk"
          fi
          if [ -n "$UNSIGNED_AAB" ]; then
            cp "$UNSIGNED_AAB" "release_out/BansifyEmail-v${V_NAME}-PlayStore-UNSIGNED.aab"
          fi

      - name: Write checksums
        run: |
          set -euo pipefail
          cd release_out
          sha256sum BansifyEmail-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Bansify-Email-v${{ steps.versioning.outputs.v_name }}-Build${{ steps.versioning.outputs.v_code }}
          path: release_out/
          if-no-files-found: warn

      # Every push to main/master or a tag produces a new versioned release, exactly like the
      # Bansify Accounts app releases.
      - name: Publish versioned GitHub Release
        if: steps.versioning.outputs.v_mode == 'versioned'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.versioning.outputs.v_tag }}
          name: ${{ steps.versioning.outputs.v_tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release_out/*

      # Any other branch refreshes one rolling pre-release, so every push still gives a
      # downloadable APK without filling the release list with preview versions.
      - name: Publish rolling pre-release
        if: steps.versioning.outputs.v_mode == 'rolling'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.versioning.outputs.v_tag }}
          name: Latest build (${{ github.ref_name }})
          draft: false
          prerelease: true
          make_latest: 'false'
          body: |
            Automatic build of branch `${{ github.ref_name }}` at `${{ github.sha }}`.

            This is a rolling pre-release: its assets are replaced on every push to
            `${{ github.ref_name }}`. Versioned releases (`v<version>`) are published from
            `main`/`master` pushes and `v*` tags.
          files: release_out/*
