name: Build Signed Release APK & Publish GitHub Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version Name (e.g. 1.0.1 - leave empty for auto 1.0.X)'
        required: false
        default: ''
      version_code:
        description: 'Version Code (Integer, e.g. 12 - leave blank for auto increment)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign & Publish Gothwad Mail APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Ensure Android SDK 36 components
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          chmod +x ./gradlew
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            if [ ! -d "$SDK_ROOT/platforms/android-36" ] || [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
              "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
            fi
          fi

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Determine Version Code and Name
        id: versioning
        run: |
          if [ -n "${{ inputs.version_code }}" ]; then
            V_CODE="${{ inputs.version_code }}"
          else
            V_CODE="${{ github.run_number }}"
          fi

          if [ -n "${{ inputs.version_name }}" ]; then
            V_NAME="${{ inputs.version_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            V_NAME="${GITHUB_REF_NAME#v}"
          else
            V_NAME="1.0.${V_CODE}"
          fi

          echo "Determined Version Code: $V_CODE"
          echo "Determined Version Name: $V_NAME"
          echo "v_code=$V_CODE" >> "$GITHUB_OUTPUT"
          echo "v_name=$V_NAME" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          ./gradlew :app:testDebugUnitTest \
            -PversionCode=${{ steps.versioning.outputs.v_code }} \
            -PversionName=${{ steps.versioning.outputs.v_name }} \
            --no-daemon --max-workers=2

      - name: Build Release APK, Debug APK & Play Store AAB
        run: |
          ./gradlew :app:assembleRelease :app:assembleDebug :app:bundleRelease \
            -PversionCode=${{ steps.versioning.outputs.v_code }} \
            -PversionName=${{ steps.versioning.outputs.v_name }} \
            --no-daemon --max-workers=2

      - name: Sign Release APK & AAB using Repository Keystore Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          V_NAME: ${{ steps.versioning.outputs.v_name }}
        run: |
          mkdir -p release_out

          UNSIGNED_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug/ -name "*.apk" | head -n 1)
          UNSIGNED_AAB=$(find app/build/outputs/bundle/release/ -name "*.aab" | head -n 1)

          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "release_out/GothwadMail-v${V_NAME}-Debug.apk"
          fi

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASS" ]; then
            echo "::error::Missing required keystore secrets! Configure RELEASE_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD in GitHub Repo Settings -> Secrets."
            exit 1
          fi

          KS_PATH="/tmp/gothwad_mail_release.jks"
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$KS_PATH"

          DETECTED_ALIAS=$(keytool -list -v -keystore "$KS_PATH" -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -i "Alias name:" | head -n 1 | sed 's/.*Alias name: //I' | tr -d '\r' | xargs || true)
          if [ -n "$KEY_ALIAS" ]; then
            ACTUAL_ALIAS="$KEY_ALIAS"
          elif [ -n "$DETECTED_ALIAS" ]; then
            ACTUAL_ALIAS="$DETECTED_ALIAS"
          else
            echo "::error::KEY_ALIAS secret is empty and could not be auto-detected from keystore."
            rm -f "$KS_PATH"
            exit 1
          fi

          ZIPALIGN=$(find "$ANDROID_HOME/build-tools/" -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find "$ANDROID_HOME/build-tools/" -name "apksigner" | sort -V | tail -n 1)
          [ -n "$APKSIGNER" ] || { echo "::error::apksigner not found in ANDROID_HOME"; rm -f "$KS_PATH"; exit 1; }

          if [ -n "$UNSIGNED_APK" ]; then
            UNALIGNED_TEMP="/tmp/unaligned_release.apk"
            if [ -n "$ZIPALIGN" ]; then
              "$ZIPALIGN" -v -p 4 "$UNSIGNED_APK" "$UNALIGNED_TEMP" || cp "$UNSIGNED_APK" "$UNALIGNED_TEMP"
            else
              cp "$UNSIGNED_APK" "$UNALIGNED_TEMP"
            fi

            RELEASE_APK="release_out/GothwadMail-v${V_NAME}-Release.apk"
            "$APKSIGNER" sign \
              --ks "$KS_PATH" \
              --ks-key-alias "$ACTUAL_ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASS" \
              --key-pass "pass:${KEY_PASS:-$KEYSTORE_PASS}" \
              --out "$RELEASE_APK" \
              "$UNALIGNED_TEMP"

            "$APKSIGNER" verify --verbose --print-certs "$RELEASE_APK"
            rm -f "$UNALIGNED_TEMP"

            CERT_COLON=$(keytool -list -v -keystore "$KS_PATH" -alias "$ACTUAL_ALIAS" -storepass "$KEYSTORE_PASS" 2>/dev/null | grep -i "SHA256:" | head -n 1 | sed 's/.*SHA256: //I' | tr -d '\r' | xargs || true)
            CERT_HEX=$(echo "$CERT_COLON" | tr -d ':' | tr '[:upper:]' '[:lower:]')
            {
              echo "### Gothwad Mail v${V_NAME} Release Signing Identity"
              echo "- Package: \`com.gothwad.mail\`"
              echo "- App Link SHA-256 (\`assetlinks.json\`): \`${CERT_COLON}\`"
              echo "- D1 \`ecosystem_apps\` SHA-256 (lowercase hex): \`${CERT_HEX}\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$UNSIGNED_AAB" ]; then
            RELEASE_AAB="release_out/GothwadMail-v${V_NAME}-PlayStore.aab"
            cp "$UNSIGNED_AAB" "$RELEASE_AAB"
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore "$KS_PATH" \
              -storepass "$KEYSTORE_PASS" \
              -keypass "${KEY_PASS:-$KEYSTORE_PASS}" \
              "$RELEASE_AAB" \
              "$ACTUAL_ALIAS"
          fi

          rm -f "$KS_PATH"
          (cd release_out && sha256sum GothwadMail-* > SHA256SUMS.txt)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Gothwad-Mail-v${{ steps.versioning.outputs.v_name }}-Build${{ steps.versioning.outputs.v_code }}
          path: release_out/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.versioning.outputs.v_name }}
          name: v${{ steps.versioning.outputs.v_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release_out/GothwadMail-v${{ steps.versioning.outputs.v_name }}-Release.apk
            release_out/GothwadMail-v${{ steps.versioning.outputs.v_name }}-Debug.apk
            release_out/GothwadMail-v${{ steps.versioning.outputs.v_name }}-PlayStore.aab
            release_out/SHA256SUMS.txt
